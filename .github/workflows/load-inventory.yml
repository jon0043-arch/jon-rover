name: Load Jon Rover Inventory

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/load-inventory.yml'
      - 'scripts/enrich_inventory.py'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install inventory tooling
        run: |
          pip install playwright beautifulsoup4 requests
          python -m playwright install --with-deps chromium
      - name: Crawl complete Willow Grove inventory
        run: |
          python - <<'PY'
          import json,re,requests
          from datetime import datetime, timezone
          from pathlib import Path
          from bs4 import BeautifulSoup

          ROOT='https://www.landroverwillowgrove.com'
          INDEX=ROOT+'/llm/inventory/'
          UA='Mozilla/5.0 (compatible; JonRoverInventorySync/1.0)'
          OLD_PATH=Path('data/inventory.json')

          def normalize_text(body):
              if '<' in body and '>' in body:
                  try:
                      return BeautifulSoup(body,'html.parser').get_text('\n')
                  except Exception:
                      pass
              return body

          def fetch(page):
              target=f'{INDEX}?limit=100&page={page}'
              headers={'User-Agent':UA,'Accept':'text/html,text/plain,text/markdown;q=0.9,*/*;q=0.8'}
              try:
                  r=requests.get(target,headers=headers,timeout=45)
                  text=normalize_text(r.text)
                  vins=len(re.findall(r'VIN:\s*[A-HJ-NPR-Z0-9]{17}',text,re.I))
                  print('DIRECT',page,r.status_code,len(r.text),'vins=',vins)
                  if vins >= 10:
                      return text
              except Exception as e:
                  print('DIRECT_FAIL',page,type(e).__name__,str(e)[:120])

              reader='https://r.jina.ai/'+target
              r=requests.get(reader,headers={'User-Agent':UA,'Accept':'text/plain'},timeout=60)
              r.raise_for_status()
              text=r.text
              vins=len(re.findall(r'VIN:\s*[A-HJ-NPR-Z0-9]{17}',text,re.I))
              print('READER',page,r.status_code,len(text),'vins=',vins)
              if vins < 1:
                  raise RuntimeError(f'No VINs found on reader page {page}')
              return text

          def num(s):
              if not s:return None
              d=re.sub(r'[^0-9]','',s)
              return int(d) if d else None

          def clean_title(s):
              s=re.sub(r'^\s*[*-]\s*','',s or '')
              m=re.match(r'^\[([^\]]+)\]\((https?://[^)]+)\)$',s)
              if m:s=m.group(1)
              return re.sub(r'\s+',' ',s).strip()

          def parse(text):
              lines=[re.sub(r'\s+',' ',x).strip() for x in text.splitlines()]
              nonempty=[x for x in lines if x]
              out=[]
              for i,line in enumerate(nonempty):
                  vm=re.search(r'VIN:\s*([A-HJ-NPR-Z0-9]{17})',line,re.I)
                  if not vm:continue
                  vin=vm.group(1).upper()
                  prev=nonempty[max(0,i-16):i]
                  condition=None; ci=None
                  for j in range(len(prev)-1,-1,-1):
                      if re.fullmatch(r'(Certified Used|Used|New)',prev[j],re.I):
                          condition=prev[j]
                          ci=j
                          break
                  if not condition:continue
                  miles=next((x for x in reversed(prev) if re.fullmatch(r'[\d,]+\s+miles?',x,re.I)),None)
                  price_line=next((x for x in reversed(prev) if re.fullmatch(r'\$[\d,]+',x)),None)
                  call_price=any(re.fullmatch(r'Call for price',x,re.I) for x in prev)
                  title_line=''
                  for cand in reversed(prev[:ci]):
                      raw=clean_title(cand)
                      if re.match(r'^(19|20)\d{2}\s+',raw):
                          title_line=cand
                          break
                  if not title_line:
                      for cand in reversed(prev[:ci]):
                          raw=clean_title(cand)
                          if re.match(r'^(Vehicle Inventory|Land Rover Willow Grove|Filter Examples|Active Filters|Page \d+)',raw,re.I):continue
                          if raw.startswith('$') or re.fullmatch(r'[\d,]+\s+miles?',raw,re.I):continue
                          title_line=cand;break
                  title=clean_title(title_line) or vin
                  link=None
                  for cand in reversed(prev[:ci+1]):
                      m=re.search(r'\((https?://[^)]+)\)',cand)
                      if m and ('/inventory/' in m.group(1) or '/new-' in m.group(1) or '/used-' in m.group(1)):
                          link=m.group(1);break
                  out.append({
                      'vin':vin,'title':title,'condition':condition,
                      'mileage':num(miles),'price':num(price_line) if price_line else None,
                      'url':link or ROOT+'/?s='+vin,
                      'image':None,'images':[],'stock':None,'exterior':None,
                      'interior':None,'interiorFamily':None,'features':[]
                  })
              return out,nonempty

          old={}
          try:
              old_data=json.loads(OLD_PATH.read_text(encoding='utf-8'))
              old={str(v.get('vin','')).upper():v for v in old_data.get('vehicles',[]) if v.get('vin')}
              print('OLD',len(old))
          except Exception as e:
              print('OLD_FAIL',type(e).__name__)

          first=fetch(1)
          firstv,lines=parse(first)
          joined=' '.join(lines)
          tm=re.search(r'([\d,]+)\s+vehicles?\s+found',joined,re.I)
          expected=int(tm.group(1).replace(',','')) if tm else None
          pm=re.search(r'Page\s+1\s+of\s+(\d+)',joined,re.I)
          pages=int(pm.group(1)) if pm else (max(1,(expected+99)//100) if expected else 3)

          byvin={v['vin']:v for v in firstv}
          for p in range(2,pages+1):
              vs,_=parse(fetch(p))
              for v in vs:byvin[v['vin']]=v

          vehicles=[]
          for v in byvin.values():
              prior=old.get(v['vin'],{})
              for key in ('image','images','stock','exterior','interior','interiorFamily','features'):
                  if prior.get(key) not in (None,'',[]):
                      v[key]=prior.get(key)
              if '/?s=' in v['url'] and prior.get('url') and '/inventory/' in prior.get('url',''):
                  v['url']=prior['url']
              vehicles.append(v)

          print('FINAL',json.dumps({'expected':expected,'pages':pages,'count':len(vehicles)}))
          if expected and len(vehicles)!=expected:
              raise SystemExit(f'Parsed {len(vehicles)} of expected {expected}; refusing partial inventory')
          if len(vehicles)<150:
              raise SystemExit(f'Only parsed {len(vehicles)} vehicles; refusing partial inventory')

          OLD_PATH.parent.mkdir(exist_ok=True)
          OLD_PATH.write_text(json.dumps({
              'source':'Land Rover Willow Grove',
              'expected':expected,
              'count':len(vehicles),
              'fetchedAt':datetime.now(timezone.utc).isoformat(),
              'vehicles':vehicles
          },indent=2),encoding='utf-8')
          PY
      - name: Enrich make, model, VIN details, mileage and colors
        run: python scripts/enrich_inventory.py
      - name: Commit inventory snapshot
        run: |
          git config user.name 'jon-rover-bot'
          git config user.email 'actions@users.noreply.github.com'
          git add data/inventory.json
          git diff --cached --quiet && exit 0
          git commit -m 'Refresh Willow Grove inventory snapshot'
          git push
