name: Load Jon Rover Inventory

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/load-inventory.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install requests
        run: pip install requests
      - name: Fetch and parse dealer inventory
        run: |
          python - <<'PY'
          import json,re,requests,time
          from pathlib import Path
          from urllib.parse import quote

          BASE='https://www.landroverwillowgrove.com/llm/inventory/'
          H={'User-Agent':'Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 Chrome/128 Safari/537.36','Accept':'text/html,text/plain,*/*'}

          def parse(text):
              out=[]
              pat=re.compile(r'(?ms)(?:^|\n)\s*[*-]?\s*(?:\[)?((?:19|20)\d{2}[^\n\]]+?)(?:\]\([^\n)]+\))?\s*\n+\s*(Certified Used|Used|New)\s*\n+\s*([\d,]+)\s+miles?\s*\n+\s*\$([\d,]+)\s*\n+\s*VIN:\s*([A-HJ-NPR-Z0-9]{17})',re.I)
              for m in pat.finditer(text):
                  out.append({'title':re.sub(r'^\s*[*-]\s*','',m.group(1)).strip(),'condition':m.group(2).strip(),'mileage':int(m.group(3).replace(',','')),'price':int(m.group(4).replace(',','')),'vin':m.group(5).upper(),'url':BASE,'image':None,'stock':None,'exterior':None,'interior':None,'interiorFamily':None,'features':[]})
              return out

          def getters(target):
              encoded=quote(target,safe='')
              return [
                  ('direct',target),
                  ('jina-https','https://r.jina.ai/https://'+target.removeprefix('https://')),
                  ('jina-http','https://r.jina.ai/http://'+target.removeprefix('https://')),
                  ('allorigins','https://api.allorigins.win/raw?url='+encoded),
                  ('codetabs','https://api.codetabs.com/v1/proxy?quest='+encoded),
                  ('corsproxy','https://corsproxy.io/?url='+encoded),
              ]

          session=requests.Session()
          def fetch_target(target,preferred=None):
              options=getters(target)
              if preferred:
                  options=sorted(options,key=lambda x:0 if x[0]==preferred else 1)
              errors=[]
              for name,url in options:
                  try:
                      r=session.get(url,headers=H,timeout=25)
                      text=r.text
                      count=len(parse(text))
                      print(name,r.status_code,'parsed',count,'bytes',len(text))
                      if r.ok and count:
                          return name,text
                      errors.append(f'{name}:{r.status_code}:{len(text)}')
                  except Exception as e:
                      errors.append(f'{name}:{type(e).__name__}')
              raise RuntimeError('No source path returned vehicles: '+', '.join(errors))

          preferred,first=fetch_target(BASE)
          tm=re.search(r'([\d,]+)\s+vehicles?\s+found',first,re.I)
          expected=int(tm.group(1).replace(',','')) if tm else None
          vehicles={v['vin']:v for v in parse(first)}
          print('preferred',preferred,'expected',expected,'first',len(vehicles))

          for p in range(2,7):
              if expected and len(vehicles)>=expected: break
              targets=[f'{BASE}?limit=100&page={p}',f'{BASE}?_p={p}']
              pagegot=False
              for target in targets:
                  try:
                      _,txt=fetch_target(target,preferred)
                      parsed=parse(txt)
                      before=len(vehicles)
                      for v in parsed: vehicles[v['vin']]=v
                      print('page',p,'added',len(vehicles)-before,'total',len(vehicles))
                      if len(vehicles)>before:
                          pagegot=True; break
                  except Exception as e:
                      print('page attempt failed',target,e)
              if not pagegot: break

          data={'source':'Land Rover Willow Grove','expected':expected,'count':len(vehicles),'vehicles':list(vehicles.values())}
          print(json.dumps({'expected':expected,'count':len(vehicles),'path':preferred}))
          if len(vehicles)<200:
              raise SystemExit(f'Only parsed {len(vehicles)} vehicles; refusing partial inventory')
          Path('data').mkdir(exist_ok=True)
          Path('data/inventory.json').write_text(json.dumps(data,indent=2),encoding='utf-8')
          PY
      - name: Commit inventory snapshot
        run: |
          git config user.name 'jon-rover-bot'
          git config user.email 'actions@users.noreply.github.com'
          git add data/inventory.json
          git diff --cached --quiet && exit 0
          git commit -m 'Refresh Willow Grove inventory snapshot'
          git push
