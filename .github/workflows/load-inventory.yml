name: Load Jon Rover Inventory

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/load-inventory.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install parser dependency
        run: pip install requests
      - name: Fetch every dealer inventory page
        run: |
          python - <<'PY'
          import json,re,time
          from pathlib import Path
          import requests

          DEALER='https://www.landroverwillowgrove.com'
          INDEX=f'{DEALER}/llm/inventory/'
          READER='https://r.jina.ai/'
          UA='Mozilla/5.0'

          def fetch(url):
              r=requests.get(READER+url,headers={'User-Agent':UA},timeout=90)
              r.raise_for_status()
              return r.text

          def clean_title(value):
              return re.sub(r'\s+',' ',value).strip(' -|')

          def parse(text):
              lines=[re.sub(r'^#+\s*','',x).strip() for x in text.splitlines()]
              out=[]
              for i,line in enumerate(lines):
                  vm=re.search(r'VIN:\s*([A-HJ-NPR-Z0-9]{17})',line,re.I)
                  if not vm:
                      continue
                  block=[x for x in lines[max(0,i-22):i+8] if x]
                  condition=next((x for x in reversed(block[:22]) if x in ('New','Used','Certified Used')),None)
                  price=next((x for x in reversed(block[:22]) if re.fullmatch(r'\$[\d,]+',x)),None)
                  miles=next((x for x in reversed(block[:22]) if re.fullmatch(r'[\d,]+\s+miles?',x,re.I)),None)
                  title=next((clean_title(x) for x in reversed(block[:22]) if re.match(r'^(19|20)\d{2}\s+',clean_title(x))),None)
                  if not all((condition,price,miles,title)):
                      continue
                  listing=None
                  for x in block:
                      m=re.search(r'https://www\.landroverwillowgrove\.com/[^\s)]+',x)
                      if m and '/llm/inventory/' not in m.group(0):
                          listing=m.group(0).rstrip('.,')
                          break
                  out.append({
                      'vin':vm.group(1).upper(),
                      'title':title,
                      'condition':condition,
                      'mileage':int(re.sub(r'\D','',miles)),
                      'price':int(re.sub(r'\D','',price)),
                      'url':listing or INDEX,
                      'image':None,
                      'stock':None,
                      'exterior':None,
                      'interior':None,
                      'interiorFamily':None,
                      'features':[]
                  })
              return out

          vehicles={}
          expected=None
          page=1
          stagnant=0

          while page <= 10:
              url=INDEX if page==1 else f'{INDEX}?page={page}'
              text=fetch(url)
              if expected is None:
                  tm=re.search(r'(\d[\d,]*)\s+vehicles?\s+found',text,re.I)
                  if tm:
                      expected=int(tm.group(1).replace(',',''))
              parsed=parse(text)
              before=len(vehicles)
              for v in parsed:
                  vehicles[v['vin']]=v
              added=len(vehicles)-before
              print(f'PAGE {page}: parsed={len(parsed)} added={added} total={len(vehicles)} expected={expected}')
              if expected and len(vehicles)>=expected:
                  break
              stagnant = stagnant + 1 if added == 0 else 0
              if stagnant >= 2:
                  break
              page += 1
              time.sleep(1)

          data={'source':'Land Rover Willow Grove','expected':expected,'count':len(vehicles),'vehicles':list(vehicles.values())}
          print('FINAL',json.dumps({'expected':expected,'count':len(vehicles),'pages':page}))
          if not expected:
              raise SystemExit('Could not read dealer inventory total')
          if len(vehicles)!=expected:
              raise SystemExit(f'Parsed {len(vehicles)} of expected {expected}; refusing partial inventory')
          Path('data').mkdir(exist_ok=True)
          Path('data/inventory.json').write_text(json.dumps(data,indent=2),encoding='utf-8')
          PY
      - name: Commit inventory snapshot
        run: |
          git config user.name 'jon-rover-bot'
          git config user.email 'actions@users.noreply.github.com'
          git add data/inventory.json
          git diff --cached --quiet && exit 0
          git commit -m 'Refresh Willow Grove inventory snapshot'
          git push
