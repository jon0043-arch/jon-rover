name: Load Jon Rover Inventory

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/load-inventory.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install browser tooling
        run: |
          pip install playwright beautifulsoup4
          python -m playwright install --with-deps chromium
      - name: Crawl complete Dealer Inspire inventory
        run: |
          python - <<'PY'
          import asyncio,json,re
          from pathlib import Path
          from urllib.parse import urljoin
          from bs4 import BeautifulSoup
          from playwright.async_api import async_playwright

          ROOT='https://www.landroverwillowgrove.com'
          UA='Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/128.0 Safari/537.36'

          def attr(el,*names):
              for n in names:
                  v=el.get(n)
                  if v not in (None,''): return v
              return None

          def num(v):
              if v is None:return None
              m=re.search(r'[\d,]+',str(v)); return int(m.group().replace(',','')) if m else None

          def price(v):
              if v is None:return None
              m=re.search(r'\$?\s*([\d,]+)',str(v)); return int(m.group(1).replace(',','')) if m else None

          def parse_cards(html,condition):
              soup=BeautifulSoup(html or '', 'html.parser'); out=[]; seen=set()
              for el in soup.select('[data-vin], [data-vehicle-vin], .vehicle, .vehicle-card, .inventory-item, .vehicle-wrap, article'):
                  blob=el.get_text(' ',strip=True)
                  vin=attr(el,'data-vin','data-vehicle-vin')
                  if not vin:
                      m=re.search(r'\bVIN\s*:?\s*([A-HJ-NPR-Z0-9]{17})\b',blob,re.I); vin=m.group(1) if m else None
                  if not vin or not re.fullmatch(r'[A-HJ-NPR-Z0-9]{17}',str(vin),re.I):continue
                  vin=str(vin).upper()
                  if vin in seen:continue
                  seen.add(vin)
                  year=attr(el,'data-year')
                  if not year:
                      m=re.search(r'\b(19\d{2}|20\d{2})\b',blob); year=m.group(1) if m else None
                  make=attr(el,'data-make'); model=attr(el,'data-model'); trim=attr(el,'data-trim')
                  title=' '.join(str(x) for x in (year,make,model,trim) if x)
                  if not title:
                      h=el.select_one('h1,h2,h3,h4,.title,.vehicle-title,.vehicle-heading'); title=h.get_text(' ',strip=True) if h else vin
                  p=price(attr(el,'data-price','data-msrp'))
                  if p is None:
                      m=re.search(r'\$\s*([\d,]+)',blob); p=int(m.group(1).replace(',','')) if m else None
                  mileage=num(attr(el,'data-mileage','data-miles'))
                  if mileage is None:
                      m=re.search(r'([\d,]+)\s*(?:miles|mi)\b',blob,re.I); mileage=int(m.group(1).replace(',','')) if m else (0 if condition=='New' else None)
                  links=[a.get('href') for a in el.select('a[href]')]
                  listing=next((urljoin(ROOT,h) for h in links if h and ('/inventory/' in h or '/used-' in h or '/new-' in h)),None)
                  if not listing and links:listing=urljoin(ROOT,links[0])
                  img=el.select_one('img'); image=None
                  if img:
                      image=attr(img,'src','data-src','data-lazy-src','data-original')
                      if image:image=urljoin(ROOT,image)
                  out.append({'vin':vin,'title':title.strip(),'condition':condition,'mileage':mileage,'price':p,'url':listing or ROOT+'/','image':image,'stock':attr(el,'data-stock','data-stock-number'),'exterior':attr(el,'data-ext-color','data-exterior-color','data-exterior'),'interior':attr(el,'data-int-color','data-interior-color','data-interior'),'interiorFamily':None,'features':[]})
              return out

          async def wait_for_change(page,before_vins):
              for _ in range(30):
                  await page.wait_for_timeout(500)
                  now={v['vin'] for v in parse_cards(await page.content(),'x')}
                  if now and now!=before_vins:return True
              return False

          async def crawl(browser,path,condition):
              ctx=await browser.new_context(user_agent=UA,viewport={'width':1440,'height':1200})
              page=await ctx.new_page()
              await page.goto(ROOT+path,wait_until='domcontentloaded',timeout=60000)
              await page.wait_for_timeout(6000)
              allv={}; visited=[]
              for step in range(1,60):
                  cards=parse_cards(await page.content(),condition)
                  vins={v['vin'] for v in cards}
                  before=len(allv)
                  for v in cards:allv[v['vin']]=v
                  print(condition,'STEP',step,'url=',page.url,'pageCards=',len(cards),'added=',len(allv)-before,'total=',len(allv))
                  if not cards:break
                  signature=tuple(sorted(vins))
                  if signature in visited:
                      print(condition,'repeated page signature; stop');break
                  visited.append(signature)

                  candidates=await page.evaluate("""() => [...document.querySelectorAll('a,button')].map((e,i)=>({i,text:(e.innerText||e.textContent||'').trim(),href:e.href||'',rel:e.getAttribute('rel')||'',aria:e.getAttribute('aria-label')||'',title:e.getAttribute('title')||'',cls:typeof e.className==='string'?e.className:''})).filter(x => /next|›|»/i.test(x.text+' '+x.rel+' '+x.aria+' '+x.title+' '+x.cls) || /^\d+$/.test(x.text)).slice(-40)""")
                  print(condition,'pagination candidates=',json.dumps(candidates)[:2500])

                  selectors=[
                    'a[rel="next"]','button[rel="next"]',
                    'a[aria-label*="Next" i]','button[aria-label*="Next" i]',
                    'a[title*="Next" i]','button[title*="Next" i]',
                    '.pagination a.next','.pagination button.next','.pagination-next',
                    'a.next','button.next','li.next a','li.next button',
                    '[class*="pagination"] a:has-text("Next")','[class*="pagination"] button:has-text("Next")'
                  ]
                  clicked=False
                  for sel in selectors:
                      try:
                          loc=page.locator(sel).filter(visible=True)
                          if await loc.count():
                              target=loc.first
                              if await target.is_visible() and await target.is_enabled():
                                  print(condition,'click selector',sel,'text=',(await target.inner_text())[:100])
                                  try:
                                      await target.click(timeout=10000)
                                  except Exception:
                                      await target.click(timeout=10000,force=True)
                                  clicked=True;break
                      except Exception:pass
                  if not clicked:
                      # Fallback: choose the candidate that clearly looks like Next.
                      nexts=[c for c in candidates if re.search(r'next|›|»',str(c.get('text',''))+' '+str(c.get('rel',''))+' '+str(c.get('aria',''))+' '+str(c.get('title',''))+' '+str(c.get('cls','')),re.I)]
                      if nexts:
                          idx=nexts[-1]['i']
                          print(condition,'JS click candidate index',idx,nexts[-1])
                          clicked=await page.evaluate("""idx => {const es=[...document.querySelectorAll('a,button')]; if(!es[idx])return false; es[idx].click(); return true;}""",idx)
                  if not clicked:
                      print(condition,'NO NEXT CONTROL');break
                  changed=await wait_for_change(page,vins)
                  print(condition,'changed=',changed,'newurl=',page.url)
                  if not changed:
                      await page.wait_for_timeout(3000)
                      cards2=parse_cards(await page.content(),condition)
                      if {v['vin'] for v in cards2}==vins:break
              await ctx.close();return allv

          async def main():
              async with async_playwright() as p:
                  browser=await p.chromium.launch(headless=True)
                  newv=await crawl(browser,'/new-vehicles/','New')
                  usedv=await crawl(browser,'/pre-owned-vehicles/','Used')
                  vehicles=dict(newv);vehicles.update(usedv)
                  expected=None
                  pg=await browser.new_page(user_agent=UA)
                  try:
                      await pg.goto(ROOT+'/llm/inventory/',wait_until='domcontentloaded',timeout=60000);txt=await pg.locator('body').inner_text()
                      m=re.search(r'(\d[\d,]*)\s+vehicles?\s+found',txt,re.I);expected=int(m.group(1).replace(',','')) if m else None
                  except Exception as e:print('count check',type(e).__name__,str(e)[:120])
                  await browser.close()
                  print('FINAL',json.dumps({'expected':expected,'new':len(newv),'used':len(usedv),'count':len(vehicles)}))
                  if expected and len(vehicles)!=expected:raise SystemExit(f'Parsed {len(vehicles)} of expected {expected}; refusing partial inventory')
                  if len(vehicles)<200:raise SystemExit(f'Only parsed {len(vehicles)} vehicles; refusing partial inventory')
                  Path('data').mkdir(exist_ok=True)
                  Path('data/inventory.json').write_text(json.dumps({'source':'Land Rover Willow Grove','expected':expected,'count':len(vehicles),'vehicles':list(vehicles.values())},indent=2),encoding='utf-8')

          asyncio.run(main())
          PY
      - name: Commit inventory snapshot
        run: |
          git config user.name 'jon-rover-bot'
          git config user.email 'actions@users.noreply.github.com'
          git add data/inventory.json
          git diff --cached --quiet && exit 0
          git commit -m 'Refresh Willow Grove inventory snapshot'
          git push
