name: Load Jon Rover Inventory
# manual inventory refresh trigger: 2026-09-21

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/load-inventory.yml'
      - 'scripts/enrich_inventory.py'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install browser tooling
        run: |
          pip install playwright beautifulsoup4 requests
          python -m playwright install --with-deps chromium
      - name: Crawl complete Dealer Inspire inventory
        run: |
          python - <<'PY'
          import json,re,requests
          from datetime import datetime, timezone
          from pathlib import Path

          ROOT='https://www.landroverwillowgrove.com'
          INDEX=ROOT+'/llm/inventory/'
          HEADERS={
              'User-Agent':'GPTBot/1.0 (+https://openai.com/gptbot)',
              'Accept':'text/html, text/plain;q=0.9, */*;q=0.8',
          }

          def fetch(page):
              url=f'{INDEX}?limit=100&page={page}'
              r=requests.get(url,headers=HEADERS,timeout=60)
              print('FETCH',page,r.status_code,len(r.text),r.url)
              if re.search(r'VIN:\\s*[A-HJ-NPR-Z0-9]{17}',r.text,re.I):
                  return r.text
              r.raise_for_status()
              return r.text

          def num(s):
              if not s:return None
              d=re.sub(r'[^0-9]','',s)
              return int(d) if d else None

          def parse(text):
              # The LLM endpoint is intentionally text-friendly. Strip tags, then parse
              # title / condition / miles / price / VIN blocks in order.
              text=re.sub(r'<script\\b[^>]*>.*?</script>',' ',text,flags=re.I|re.S)
              text=re.sub(r'<style\\b[^>]*>.*?</style>',' ',text,flags=re.I|re.S)
              text=re.sub(r'<[^>]+>','\\n',text)
              text=(text.replace('&amp;','&').replace('&#039;',"'").replace('&quot;','"')
                        .replace('&nbsp;',' ').replace('&reg;','®'))
              lines=[re.sub(r'\\s+',' ',x).strip() for x in text.splitlines() if re.sub(r'\\s+',' ',x).strip()]
              out=[]
              for i,line in enumerate(lines):
                  vm=re.search(r'VIN:\\s*([A-HJ-NPR-Z0-9]{17})',line,re.I)
                  if not vm: continue
                  vin=vm.group(1).upper()
                  prev=lines[max(0,i-12):i]
                  condition=next((x for x in reversed(prev) if re.fullmatch(r'(Certified Used|Used|New)',x,re.I)),None)
                  miles=next((x for x in reversed(prev) if re.fullmatch(r'[\\d,]+\\s+miles?',x,re.I)),None)
                  price_line=next((x for x in reversed(prev) if re.fullmatch(r'\\$[\\d,]+',x)),None)
                  title=''
                  if condition:
                      ci=max(j for j,x in enumerate(prev) if x.lower()==condition.lower())
                      for cand in reversed(prev[:ci]):
                          if re.match(r'^(Vehicle Inventory|Land Rover Willow Grove|Filter Examples|Active Filters|Page \\d+)',cand,re.I): continue
                          if cand.startswith('$') or re.fullmatch(r'[\\d,]+\\s+miles?',cand,re.I): continue
                          title=cand; break
                  if not title:
                      title=vin
                  price=num(price_line)
                  mileage=num(miles)
                  out.append({'vin':vin,'title':title,'condition':condition or 'Used','mileage':mileage,'price':price,'url':ROOT+'/?s='+vin,'image':None,'images':[],'stock':None,'exterior':None,'interior':None,'interiorFamily':None,'features':[]})
              return out, lines

          first=fetch(1)
          firstv,lines=parse(first)
          blob=' '.join(lines[:80])
          tm=re.search(r'([\\d,]+)\\s+vehicles?\\s+found',blob,re.I)
          expected=int(tm.group(1).replace(',','')) if tm else None
          pm=re.search(r'Page\\s+1\\s+of\\s+(\\d+)', ' '.join(lines[-100:]), re.I)
          pages=int(pm.group(1)) if pm else (max(1,(expected+99)//100) if expected else 3)
          byvin={v['vin']:v for v in firstv}
          for p in range(2,pages+1):
              vs,_=parse(fetch(p))
              for v in vs: byvin[v['vin']]=v
          vehicles=list(byvin.values())
          print('FINAL',json.dumps({'expected':expected,'pages':pages,'count':len(vehicles)}))
          if expected and len(vehicles)!=expected:
              raise SystemExit(f'Parsed {len(vehicles)} of expected {expected}; refusing partial inventory')
          if len(vehicles)<200:
              raise SystemExit(f'Only parsed {len(vehicles)} vehicles; refusing partial inventory')
          Path('data').mkdir(exist_ok=True)
          Path('data/inventory.json').write_text(json.dumps({'source':'Land Rover Willow Grove','expected':expected,'count':len(vehicles),'fetchedAt':datetime.now(timezone.utc).isoformat(),'vehicles':vehicles},indent=2),encoding='utf-8')
          PY
      - name: Enrich make, model, VIN details, mileage and colors
        run: python scripts/enrich_inventory.py
      - name: Commit inventory snapshot
        run: |
          git config user.name 'jon-rover-bot'
          git config user.email 'actions@users.noreply.github.com'
          git add data/inventory.json
          git diff --cached --quiet && exit 0
          git commit -m 'Refresh Willow Grove inventory snapshot'
          git push
