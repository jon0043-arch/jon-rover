name: Refresh Jon Rover Inventory

on:
  schedule:
    - cron: '17 */6 * * *'
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/workflows/load-inventory.yml'

permissions:
  contents: write

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install inventory tooling
        run: pip install -q requests beautifulsoup4

      - name: Build current Willow Grove inventory snapshot
        run: |
          python - <<'PY'
          import json, re, requests
          from datetime import datetime, timezone
          from pathlib import Path
          from bs4 import BeautifulSoup

          ROOT='https://www.dealerrater.com'
          BASE='/classifieds/dealer/Jaguar-Land-Rover-Willow-Grove-cars-25316/'
          DEALER='https://www.landroverwillowgrove.com'
          DATA=Path('data/inventory.json')
          UA='Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 Chrome/128 Safari/537.36'
          headers={'User-Agent':UA,'Accept':'text/html,*/*'}

          try:
              old_payload=json.loads(DATA.read_text(encoding='utf-8'))
          except Exception:
              old_payload={'vehicles':[]}
          old_vehicles=old_payload.get('vehicles') or []
          old_by_vin={str(v.get('vin','')).upper():v for v in old_vehicles if v.get('vin')}

          def get(path):
              r=requests.get(ROOT+path,headers=headers,timeout=45)
              r.raise_for_status()
              return r.text

          def as_int(value):
              if value in (None,''): return None
              digits=re.sub(r'[^0-9]','',str(value))
              return int(digits) if digits else None

          def family(value):
              x=(value or '').lower()
              if 'caraway' in x or any(k in x for k in ['tan','beige','camel','caramel']): return 'tan'
              if 'light cloud' in x or any(k in x for k in ['ivory','cream','off-white','off white','cloud/ebony','cloud / ebony']): return 'off-white'
              if 'ebony' in x or 'black' in x: return 'black'
              if 'deep garnet' in x or any(k in x for k in ['burgundy','wine','garnet','oxblood']): return 'red-wine'
              return None

          first=get(BASE)
          soup=BeautifulSoup(first,'html.parser')
          pages=1
          for a in soup.find_all('a',href=True):
              m=re.search(r'/page(\d+)/',a['href'])
              if m: pages=max(pages,int(m.group(1)))

          feed_order=[]
          current={}
          for p in range(1,pages+1):
              path=BASE if p==1 else BASE+f'page{p}/'
              page=first if p==1 else get(path)
              s=BeautifulSoup(page,'html.parser')
              page_count=0
              for tag in s.find_all('script',attrs={'type':'application/ld+json'}):
                  raw=tag.string or tag.get_text()
                  if 'vehicleIdentificationNumber' not in raw:
                      continue
                  try:
                      d=json.loads(raw)
                  except Exception:
                      continue
                  if not isinstance(d,dict) or d.get('@type')!='Car':
                      continue
                  vin=str(d.get('vehicleIdentificationNumber') or '').upper().strip()
                  if not re.fullmatch(r'[A-HJ-NPR-Z0-9]{17}',vin):
                      continue

                  offers=d.get('offers') if isinstance(d.get('offers'),dict) else {}
                  images=d.get('image') or []
                  if isinstance(images,str): images=[images]
                  images=[x for x in images if isinstance(x,str) and x.startswith('http')]

                  year=as_int(d.get('modelDate'))
                  make=str(d.get('manufacturer') or '').strip() or None
                  model=str(d.get('model') or '').strip() or None
                  title=str(d.get('name') or '').strip()
                  if not title:
                      title=' '.join(str(x) for x in [year,make,model] if x)
                  prefix=' '.join(str(x) for x in [year,make,model] if x)
                  trim=title[len(prefix):].strip() if prefix and title.lower().startswith(prefix.lower()) else None
                  trim=trim or None

                  prior=old_by_vin.get(vin,{})
                  prior_url=str(prior.get('url') or '')
                  listing_url=prior_url if prior_url.startswith(DEALER+'/inventory/') else f'{DEALER}/?s={vin}'
                  condition='New' if 'NewCondition' in str(d.get('itemCondition') or '') else 'Used'
                  interior=str(d.get('vehicleInteriorColor') or '').strip() or None
                  exterior=str(d.get('color') or '').strip() or None

                  vehicle={
                      'vin':vin,
                      'title':title,
                      'condition':condition,
                      'mileage':as_int(d.get('mileageFromOdometer')),
                      'price':as_int(offers.get('price')),
                      'url':listing_url,
                      'image':images[0] if images else prior.get('image'),
                      'images':images if images else (prior.get('images') or []),
                      'stock':str(d.get('sku') or '').strip() or prior.get('stock'),
                      'exterior':exterior or prior.get('exterior'),
                      'interior':interior or prior.get('interior'),
                      'interiorFamily':family(interior) or prior.get('interiorFamily'),
                      'features':prior.get('features') or [],
                      'year':year,
                      'make':make,
                      'model':model,
                      'trim':trim,
                  }
                  if vin not in current:
                      feed_order.append(vin)
                  current[vin]=vehicle
                  page_count+=1
              print('PAGE',p,'CARS',page_count,'UNIQUE',len(current))

          if len(current) < 150:
              raise SystemExit(f'Only parsed {len(current)} vehicles; refusing partial inventory')

          # Keep familiar site ordering for vehicles still in stock, then append arrivals.
          ordered=[]
          used=set()
          for prior in old_vehicles:
              vin=str(prior.get('vin') or '').upper()
              if vin in current and vin not in used:
                  ordered.append(current[vin]); used.add(vin)
          for vin in feed_order:
              if vin not in used:
                  ordered.append(current[vin]); used.add(vin)

          changed=ordered != old_vehicles
          fetched_at=datetime.now(timezone.utc).isoformat() if changed else old_payload.get('fetchedAt')
          payload={
              'source':'Jaguar Land Rover Willow Grove syndicated inventory',
              'expected':len(ordered),
              'count':len(ordered),
              'fetchedAt':fetched_at,
              'vehicles':ordered,
          }
          DATA.write_text(json.dumps(payload,indent=2),encoding='utf-8')
          print('FINAL',json.dumps({'pages':pages,'count':len(ordered),'changed':changed,'fetchedAt':fetched_at}))
          PY

      - name: Commit inventory snapshot
        run: |
          git config user.name 'jon-rover-bot'
          git config user.email 'actions@users.noreply.github.com'
          git add data/inventory.json
          git diff --cached --quiet && exit 0
          git commit -m 'Refresh Willow Grove inventory snapshot'
          git push
