name: Load Jon Rover Inventory

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/load-inventory.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install browser tooling
        run: |
          pip install playwright
          python -m playwright install --with-deps chromium
      - name: Fetch inventory in small filtered slices
        run: |
          python - <<'PY'
          import asyncio,json,re
          from pathlib import Path
          from urllib.parse import urlencode
          from playwright.async_api import async_playwright

          BASE='https://www.landroverwillowgrove.com/llm/inventory/'
          UA='Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 Chrome/128 Safari/537.36'

          def parse(text):
              lines=[x.strip() for x in text.splitlines()]
              out=[]
              for i,line in enumerate(lines):
                  vm=re.search(r'VIN:\s*([A-HJ-NPR-Z0-9]{17})',line,re.I)
                  if not vm: continue
                  prev=[x for x in lines[max(0,i-14):i] if x]
                  condition=next((x for x in reversed(prev) if x in ('New','Used','Certified Used')),None)
                  price=next((x for x in reversed(prev) if re.fullmatch(r'\$[\d,]+',x)),None)
                  miles=next((x for x in reversed(prev) if re.fullmatch(r'[\d,]+\s+miles?',x,re.I)),None)
                  title=next((x for x in reversed(prev) if re.match(r'^(19|20)\d{2}\s+',x)),None)
                  if not all((condition,price,miles,title)): continue
                  out.append({'vin':vm.group(1).upper(),'title':title,'condition':condition,'mileage':int(re.sub(r'\D','',miles)),'price':int(re.sub(r'\D','',price)),'url':BASE,'image':None,'stock':None,'exterior':None,'interior':None,'interiorFamily':None,'features':[]})
              return out

          async def grab(browser,params,label):
              ctx=await browser.new_context(viewport={'width':1440,'height':1200},user_agent=UA)
              page=await ctx.new_page()
              url=BASE + ('?'+urlencode(params) if params else '')
              try:
                  await page.goto(url,wait_until='domcontentloaded',timeout=60000)
                  await page.wait_for_timeout(3500)
                  text=await page.locator('body').inner_text()
                  parsed=parse(text)
                  tm=re.search(r'(\d[\d,]*)\s+vehicles?\s+found',text,re.I)
                  reported=int(tm.group(1).replace(',','')) if tm else None
                  print(label,'url=',page.url,'reported=',reported,'parsed=',len(parsed))
                  return parsed,reported,text[:300]
              except Exception as e:
                  print(label,'FAILED',type(e).__name__,str(e)[:160])
                  return [],None,''
              finally:
                  await ctx.close()

          async def main():
              async with async_playwright() as p:
                  browser=await p.chromium.launch(headless=True)
                  vehicles={}; expected=None

                  # Base page gives us the authoritative total and first 100 vehicles.
                  parsed,reported,_=await grab(browser,{},'ALL')
                  if reported: expected=reported
                  for v in parsed: vehicles[v['vin']]=v

                  # The dealer's pagination redirects automated browsers. Instead, request
                  # filtered result sets that stay below the 100-row page limit and union by VIN.
                  slices=[
                    ({'type':'new','q':'Defender'},'NEW DEFENDER'),
                    ({'type':'new','q':'Range Rover'},'NEW RANGE ROVER FAMILY'),
                    ({'type':'new','q':'Discovery'},'NEW DISCOVERY'),
                    ({'type':'new','q':'Jaguar'},'NEW JAGUAR'),
                    ({'type':'used','make':'Land Rover'},'USED LAND ROVER'),
                    ({'type':'used','make':'Jaguar'},'USED JAGUAR'),
                  ]
                  other_makes=['Audi','BMW','Cadillac','Dodge','Ford','GMC','Hyundai','Jeep','Lexus','Lincoln','Mercedes-Benz','Subaru','Toyota','Volkswagen','Volvo','Chevrolet','Porsche','Genesis','Kia','Nissan','Honda','Acura','INFINITI','MINI','Maserati']
                  slices += [({'type':'used','make':m},f'USED {m.upper()}') for m in other_makes]

                  for params,label in slices:
                      parsed,reported,preview=await grab(browser,params,label)
                      before=len(vehicles)
                      for v in parsed: vehicles[v['vin']]=v
                      print(label,'added=',len(vehicles)-before,'total=',len(vehicles),'preview=',preview.replace('\n',' ')[:100])
                      if expected and len(vehicles)>=expected: break

                  await browser.close()
                  data={'source':'Land Rover Willow Grove','expected':expected,'count':len(vehicles),'vehicles':list(vehicles.values())}
                  print('FINAL',json.dumps({'expected':expected,'count':len(vehicles)}))
                  if not expected:
                      raise SystemExit('Could not read dealer inventory total')
                  if len(vehicles)!=expected:
                      raise SystemExit(f'Parsed {len(vehicles)} of expected {expected}; refusing partial inventory')
                  Path('data').mkdir(exist_ok=True)
                  Path('data/inventory.json').write_text(json.dumps(data,indent=2),encoding='utf-8')

          asyncio.run(main())
          PY
      - name: Commit inventory snapshot
        run: |
          git config user.name 'jon-rover-bot'
          git config user.email 'actions@users.noreply.github.com'
          git add data/inventory.json
          git diff --cached --quiet && exit 0
          git commit -m 'Refresh Willow Grove inventory snapshot'
          git push
