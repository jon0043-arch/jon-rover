name: Load Jon Rover Inventory
# manual inventory refresh trigger: 2026-09-21

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/load-inventory.yml'
      - 'scripts/enrich_inventory.py'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install browser tooling
        run: |
          pip install playwright beautifulsoup4 requests
          python -m playwright install --with-deps chromium
      - name: Crawl complete Dealer Inspire inventory
        run: |
          python - <<'PY'
          import json,re,requests
          from datetime import datetime, timezone
          from pathlib import Path
          from urllib.parse import urljoin

          ROOT='https://www.landroverwillowgrove.com'
          INDEX=ROOT+'/llm/inventory/'
          READER='https://r.jina.ai/https://'
          UA='Mozilla/5.0 JonRoverInventorySync/1.0'

          def fetch_text(url):
              try:
                  r=requests.get(url,headers={'User-Agent':UA,'Accept':'text/plain,text/markdown,text/html;q=0.9,*/*;q=0.8'},timeout=30)
                  if r.ok and re.search(r'VIN:\\s*[A-HJ-NPR-Z0-9]{17}',r.text,re.I):
                      return r.text
              except Exception:
                  pass
              target=READER+re.sub(r'^https://','',url)
              r=requests.get(target,headers={'Accept':'text/plain'},timeout=60)
              r.raise_for_status()
              return r.text

          def num(s):
              if not s:return None
              digits=re.sub(r'[^0-9]','',s)
              return int(digits) if digits else None

          def clean_title(s):
              s=re.sub(r'^\\s*[*-]\\s*','',s or '')
              s=re.sub(r'^\\[|\\]$','',s)
              s=re.sub(r'\\]\\([^)]*\\)$','',s)
              return re.sub(r'\\s+',' ',s).strip()

          def parse(t):
              lines=[x.strip() for x in t.splitlines()]
              out=[]
              for i,line in enumerate(lines):
                  vm=re.search(r'VIN:\\s*([A-HJ-NPR-Z0-9]{17})',line,re.I)
                  if not vm: continue
                  vin=vm.group(1).upper()
                  prev=[]
                  j=i-1
                  while j>=0 and len(prev)<14:
                      if lines[j]: prev.append(lines[j])
                      j-=1
                  price_line=next((x for x in prev if re.match(r'^\\$[\\d,]+',x)),None)
                  miles_line=next((x for x in prev if re.match(r'^[\\d,]+\\s+miles?$',x,re.I)),None)
                  cond_line=next((x for x in prev if re.match(r'^(Certified Used|Used|New)$',x,re.I)),None)
                  ci=next((k for k,x in enumerate(prev) if re.match(r'^(Certified Used|Used|New)$',x,re.I)),-1)
                  title_line=''
                  if ci>=0:
                      for k in range(ci+1,len(prev)):
                          cand=prev[k]
                          if re.match(r'^(View Full Listing|Next|Previous)',cand,re.I): continue
                          if re.match(r'^(Land Rover Willow Grove|Filter Examples|Active Filters)',cand,re.I): continue
                          if re.match(r'^Page\\s+\\d+',cand,re.I): continue
                          title_line=cand; break
                  lm=re.match(r'^\\[([^\\]]+)\\]\\((https?://[^)]+)\\)$',title_line)
                  title=clean_title(lm.group(1) if lm else title_line)
                  listing=lm.group(2) if lm else ROOT+'/?s='+vin
                  if not title or not cond_line or not price_line or not miles_line: continue
                  out.append({
                      'vin':vin,'title':title,'condition':cond_line,
                      'mileage':num(miles_line),'price':num(price_line),
                      'url':listing,'image':None,'images':[],'stock':None,
                      'exterior':None,'interior':None,'interiorFamily':None,'features':[]
                  })
              return out

          first=fetch_text(INDEX)
          m=re.search(r'([\\d,]+)\\s+vehicles?\\s+found',first,re.I)
          expected=int(m.group(1).replace(',','')) if m else None
          pm=re.search(r'Page\\s+1\\s+of\\s+(\\d+)',first,re.I)
          pages=int(pm.group(1)) if pm else (max(1,(expected+99)//100) if expected else 1)
          texts=[first]
          for p in range(2,pages+1):
              texts.append(fetch_text(f'{INDEX}?_p={p}'))

          byvin={}
          for t in texts:
              for v in parse(t): byvin[v['vin']]=v
          vehicles=list(byvin.values())
          print('FINAL',json.dumps({'expected':expected,'pages':pages,'count':len(vehicles)}))
          if expected and len(vehicles)!=expected:
              raise SystemExit(f'Parsed {len(vehicles)} of expected {expected}; refusing partial inventory')
          if len(vehicles)<200:
              raise SystemExit(f'Only parsed {len(vehicles)} vehicles; refusing partial inventory')
          Path('data').mkdir(exist_ok=True)
          Path('data/inventory.json').write_text(json.dumps({
              'source':'Land Rover Willow Grove','expected':expected,'count':len(vehicles),
              'fetchedAt':datetime.now(timezone.utc).isoformat(),'vehicles':vehicles
          },indent=2),encoding='utf-8')
          PY
      - name: Enrich make, model, VIN details, mileage and colors
        run: python scripts/enrich_inventory.py
      - name: Commit inventory snapshot
        run: |
          git config user.name 'jon-rover-bot'
          git config user.email 'actions@users.noreply.github.com'
          git add data/inventory.json
          git diff --cached --quiet && exit 0
          git commit -m 'Refresh Willow Grove inventory snapshot'
          git push
