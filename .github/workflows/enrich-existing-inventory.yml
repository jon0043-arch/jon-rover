name: Enrich Saved Jon Rover Inventory

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/enrich-existing-inventory.yml'
      - 'scripts/enrich_inventory.py'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  enrich:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install browser tooling
        run: |
          pip install playwright
          python -m playwright install --with-deps chromium
      - name: Enrich existing 246 VINs with exact colors and mileage
        run: python scripts/enrich_inventory.py
      - name: Verify enrichment quality
        run: |
          python - <<'PY'
          import json
          d=json.load(open('data/inventory.json'))
          v=d.get('vehicles') or []
          invalid={'','interior_color','exterior_color','interior color','exterior color','unknown','n/a','null','none'}
          ext=sum(1 for x in v if str(x.get('exterior') or '').strip().lower() not in invalid)
          interior=sum(1 for x in v if str(x.get('interior') or '').strip().lower() not in invalid)
          print({'count':len(v),'valid_exterior':ext,'valid_interior':interior,'stats':d.get('enrichmentStats')})
          if len(v) < 200: raise SystemExit('Inventory snapshot is unexpectedly partial')
          if ext < 150: raise SystemExit(f'Only {ext} valid exterior colors; refusing bad enrichment')
          if interior < 100: raise SystemExit(f'Only {interior} valid interior colors; refusing bad enrichment')
          PY
      - name: Commit enriched inventory
        run: |
          git config user.name 'jon-rover-bot'
          git config user.email 'actions@users.noreply.github.com'
          git add data/inventory.json
          git diff --cached --quiet && exit 0
          git commit -m 'Refresh exact exterior and interior colors'
          git pull --rebase origin main
          git push
