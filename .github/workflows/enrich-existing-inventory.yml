name: Enrich Saved Jon Rover Inventory

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/enrich-existing-inventory.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  enrich:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install enrichment tools
        run: pip install requests
      - name: Enrich colors and mileage
        run: |
          python - <<'PY'
          import json,re,time
          from datetime import datetime,timezone
          from pathlib import Path
          from urllib.parse import quote
          import requests

          SNAPSHOT=Path('data/inventory.json')
          data=json.loads(SNAPSHOT.read_text(encoding='utf-8'))
          vehicles=data.get('vehicles') or []
          if len(vehicles)<200: raise SystemExit(f'Expected full inventory, found {len(vehicles)}')
          byvin={str(v.get('vin','')).upper():v for v in vehicles if v.get('vin')}
          S=requests.Session();S.headers.update({'User-Agent':'Mozilla/5.0','Accept-Language':'en-US,en;q=0.9'})

          def clean(x):
              if not x:return None
              x=re.sub(r'\s+',' ',str(x)).strip(' |:-*#\n\t')
              return x[:100] or None

          def model_slug(title):
              t=(title or '').lower()
              year=re.search(r'\b(20\d{2}|19\d{2})\b',t)
              if not year:return None
              y=year.group(1)
              mapping=[
                ('range rover sport',f'land_rover-range_rover_sport-{y}'),
                ('range rover evoque',f'land_rover-range_rover_evoque-{y}'),
                ('range rover velar',f'land_rover-range_rover_velar-{y}'),
                ('discovery sport',f'land_rover-discovery_sport-{y}'),
                ('defender',f'land_rover-defender-{y}'),
                ('discovery',f'land_rover-discovery-{y}'),
                ('range rover',f'land_rover-range_rover-{y}'),
                ('f-pace',f'jaguar-f-pace-{y}'),
                ('f pace',f'jaguar-f-pace-{y}'),
                ('e-pace',f'jaguar-e-pace-{y}'),
                ('x4',f'bmw-x4-{y}'),('x5',f'bmw-x5-{y}'),('x3',f'bmw-x3-{y}'),
                ('gle',f'mercedes_benz-gle_class-{y}'),('gls',f'mercedes_benz-gls_class-{y}'),
                ('q7',f'audi-q7-{y}'),('q8',f'audi-q8-{y}'),('cayenne',f'porsche-cayenne-{y}')
              ]
              for needle,slug in mapping:
                  if needle in t:return slug
              return None

          def jina(url):
              target='https://r.jina.ai/https://' + url.replace('https://','').replace('http://','')
              try:
                  r=S.get(target,timeout=35)
                  if r.ok and len(r.text)>1000:return r.text
                  print('jina fail',r.status,url)
              except Exception as e:print('jina error',type(e).__name__,url)
              return ''

          def around(text,start,window=1800):return text[max(0,start-window):min(len(text),start+window)]
          def labeled(block,*labels):
              for label in labels:
                  pats=[rf'{label}\s*\n\s*([^\n]+)',rf'{label}\s*:?\s+([^\n|]+)']
                  for p in pats:
                      m=re.search(p,block,re.I)
                      if m:
                          v=clean(m.group(1))
                          if v:return v
              return None

          slugs=sorted({s for v in vehicles if (s:=model_slug(v.get('title')))})
          print('shopping families',len(slugs),slugs)
          matched=set(); pages=0
          for slug in slugs:
              for page in range(1,7):
                  url=f'https://www.cars.com/shopping/{slug}/abington-pa/?page={page}&page_size=100&maximum_distance=100'
                  text=jina(url);pages+=1
                  if not text:break
                  vins=[m for m in re.finditer(r'\b[A-HJ-NPR-Z0-9]{17}\b',text,re.I)]
                  local=0
                  for m in vins:
                      vin=m.group(0).upper();v=byvin.get(vin)
                      if not v:continue
                      block=around(text,m.start(),2200)
                      # Only accept Willow Grove rows when the dealer name is visible near the VIN.
                      if 'Willow Grove' not in block and 'willow grove' not in block.lower():continue
                      ext=labeled(block,r'Ext\.?\s*color',r'Exterior(?: color)?')
                      interior=labeled(block,r'Int\.?\s*color',r'Interior(?: color)?')
                      stock=labeled(block,r'Stock\s*#',r'Stock(?: number)?')
                      mm=re.search(r'([\d,]+)\s*(?:mi\.?|miles)\b',block,re.I)
                      mileage=int(mm.group(1).replace(',','')) if mm else None
                      if ext and len(ext)<80:v['exterior']=ext
                      if interior and len(interior)<80:v['interior']=interior
                      if stock and len(stock)<30:v['stock']=stock
                      if mileage is not None:v['mileage']=mileage
                      x=(v.get('interior') or '').lower()
                      if 'ebony' in x or 'black' in x:v['interiorFamily']='black'
                      elif 'caraway' in x or any(z in x for z in ['tan','beige']):v['interiorFamily']='tan'
                      elif 'light cloud' in x or any(z in x for z in ['ivory','cream']):v['interiorFamily']='off-white'
                      elif any(z in x for z in ['garnet','burgundy','wine']):v['interiorFamily']='red-wine'
                      matched.add(vin);local+=1
                  print(slug,'page',page,'saved matches',local,'total',len(matched))
                  # Later pages become irrelevant quickly; stop after an empty matching page beyond page 1.
                  if page>1 and local==0:break
                  time.sleep(.4)

          # Use the dealer's indexed LLM pages as a second pass for actual odometer values.
          for p in range(1,8):
              for kind in ('new','used'):
                  text=jina(f'https://www.landroverwillowgrove.com/llm/inventory/?_p={p}&type={kind}')
                  if not text:continue
                  for m in re.finditer(r'VIN:\s*([A-HJ-NPR-Z0-9]{17})',text,re.I):
                      vin=m.group(1).upper();v=byvin.get(vin)
                      if not v:continue
                      block=text[max(0,m.start()-700):m.end()+100]
                      mm=list(re.finditer(r'([\d,]+)\s+miles\b',block,re.I))
                      if mm:v['mileage']=int(mm[-1].group(1).replace(',',''))

          stats={
            'count':len(vehicles),'pages_checked':pages,'matched_secondary':len(matched),
            'mileage_nonzero':sum(1 for v in vehicles if isinstance(v.get('mileage'),int) and v.get('mileage')>0),
            'exterior':sum(1 for v in vehicles if v.get('exterior')),
            'interior':sum(1 for v in vehicles if v.get('interior')),
            'stock':sum(1 for v in vehicles if v.get('stock')),
            'photos':sum(1 for v in vehicles if v.get('image')),
          }
          print('ENRICHMENT STATS',json.dumps(stats))
          data['vehicles']=vehicles;data['count']=len(vehicles);data['fetchedAt']=datetime.now(timezone.utc).isoformat();data['enrichmentStats']=stats
          SNAPSHOT.write_text(json.dumps(data,indent=2),encoding='utf-8')
          PY
      - name: Commit enriched inventory
        run: |
          git config user.name 'jon-rover-bot'
          git config user.email 'actions@users.noreply.github.com'
          git add data/inventory.json
          git diff --cached --quiet && exit 0
          git commit -m 'Populate inventory exterior interior colors and mileage'
          git pull --rebase origin main
          git push
