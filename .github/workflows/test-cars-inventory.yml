name: Test Cars Inventory Feed

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/test-cars-inventory.yml'
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Inspect Willow Grove 403 body
        run: |
          python - <<'PY'
          import requests,re
          u='https://www.landroverwillowgrove.com/llm/inventory/?limit=100&page=1'
          h={'User-Agent':'Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 Chrome/128 Safari/537.36','Accept':'text/html,*/*'}
          r=requests.get(u,headers=h,timeout=45)
          t=r.text
          patterns={
            'rawvin':r'\\b[A-HJ-NPR-Z0-9]{17}\\b',
            'data_vin':r'data[-_]vin',
            'knownvin':r'SADCT2EX5TA757694',
            'vehicle':r'vehicle',
            'inventory':r'inventory',
            'cloudflare':r'cloudflare|challenge|captcha'
          }
          print('STATUS',r.status_code,'LEN',len(t),'TYPE',r.headers.get('content-type'))
          for k,p in patterns.items():
              m=re.findall(p,t,re.I)
              print(k,len(m),m[:20])
          print('HEAD',repr(t[:1200]))
          print('TAIL',repr(t[-1200:]))
          PY
