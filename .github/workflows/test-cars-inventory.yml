name: Validate DealerRater Full Inventory

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/test-cars-inventory.yml'
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Parse complete DealerRater inventory
        run: |
          pip -q install beautifulsoup4
          python - <<'PY'
          import requests,re,json
          from bs4 import BeautifulSoup
          ROOT='https://www.dealerrater.com'
          BASE='/classifieds/dealer/Jaguar-Land-Rover-Willow-Grove-cars-25316/'
          h={'User-Agent':'Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 Chrome/128 Safari/537.36'}
          def get(path):
              r=requests.get(ROOT+path,headers=h,timeout=45); r.raise_for_status(); return r.text
          first=get(BASE)
          soup=BeautifulSoup(first,'html.parser')
          pages=1
          for a in soup.find_all('a',href=True):
              m=re.search(r'/page(\d+)/',a['href'])
              if m: pages=max(pages,int(m.group(1)))
          byvin={}
          for p in range(1,pages+1):
              path=BASE if p==1 else BASE+f'page{p}/'
              s=BeautifulSoup(first if p==1 else get(path),'html.parser')
              n=0
              for tag in s.find_all('script',attrs={'type':'application/ld+json'}):
                  raw=tag.string or tag.get_text()
                  if 'vehicleIdentificationNumber' not in raw: continue
                  try: d=json.loads(raw)
                  except Exception as e:
                      print('JSON_FAIL',p,str(e)[:100]); continue
                  if isinstance(d,dict) and d.get('@type')=='Car' and d.get('vehicleIdentificationNumber'):
                      vin=str(d['vehicleIdentificationNumber']).upper()
                      byvin[vin]=d; n+=1
              print('PAGE',p,'CARS',n,'UNIQUE_TOTAL',len(byvin))
          print('PAGES',pages,'TOTAL',len(byvin))
          if len(byvin)<150: raise SystemExit('Too few vehicles')
          vals=list(byvin.values())
          for d in vals[:3]:
              print('SAMPLE',json.dumps({
                'vin':d.get('vehicleIdentificationNumber'),'name':d.get('name'),
                'price':(d.get('offers') or {}).get('price'),'miles':d.get('mileageFromOdometer'),
                'stock':d.get('sku'),'ext':d.get('color'),'int':d.get('vehicleInteriorColor'),
                'condition':d.get('itemCondition'),'images':len(d.get('image') or [])
              }))
          PY
