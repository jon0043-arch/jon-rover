name: Test Cars Inventory Feed

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/test-cars-inventory.yml'
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Test AutosToday dealer inventory
        run: |
          python - <<'PY'
          import requests,re
          base='https://www.autostoday.com/dealerships/land-rover-willow-grove-willow-grove-pa'
          h={'User-Agent':'Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 Chrome/128 Safari/537.36'}
          for p in (1,2,10,18):
              u=base if p==1 else base+f'?page={p}'
              r=requests.get(u,headers=h,timeout=30)
              vins=set(re.findall(r'\\b[A-HJ-NPR-Z0-9]{17}\\b',r.text,re.I))
              print('PAGE',p,'STATUS',r.status_code,'LEN',len(r.text),'VINS',len(vins),'URL',r.url)
              print('SAMPLE',sorted(vins)[:3])
          PY
