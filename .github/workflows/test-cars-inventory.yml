name: Test AI Inventory Access

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/test-cars-inventory.yml'
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Try recognized AI crawler identities
        run: |
          python - <<'PY'
          import requests,re
          u='https://www.landroverwillowgrove.com/llm/inventory/?limit=100&page=1'
          uas=[
            'ChatGPT-User/1.0',
            'OAI-SearchBot/1.0',
            'GPTBot/1.2',
            'ClaudeBot/1.0',
            'GoogleOther',
            'Mozilla/5.0 (compatible; ChatGPT-User/1.0; +https://openai.com/bot)'
          ]
          for ua in uas:
              try:
                  r=requests.get(u,headers={'User-Agent':ua,'Accept':'text/plain,text/markdown,text/html,*/*'},timeout=30)
                  t=r.text
                  vins=sorted(set(re.findall(r'VIN:\\s*([A-HJ-NPR-Z0-9]{17})',t,re.I)))
                  print('UA',ua,'STATUS',r.status_code,'LEN',len(t),'VINS',len(vins),'HEAD',repr(t[:180]))
              except Exception as e:
                  print('FAIL',ua,type(e).__name__,str(e)[:100])
          PY
