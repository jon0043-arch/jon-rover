name: Test Public Inventory Scraper

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/test-spider-inventory.yml'
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Test Dealer Inspire inventory through browser scraper
        run: |
          set -e
          python - <<'PY'
          import json, re, requests
          url='https://www.landroverwillowgrove.com/llm/inventory/?limit=100&page=1'
          r=requests.post(
              'https://api.spider.cloud/scrape',
              headers={'Content-Type':'application/json'},
              json={
                'url':url,
                'return_format':'markdown',
                'request':'browser',
                'stealth':True
              },
              timeout=120
          )
          print('STATUS', r.status_code, 'LEN', len(r.text))
          print('HEAD', repr(r.text[:1200]))
          try:
              data=r.json()
              blob=' '.join(str(x.get('content','')) for x in data if isinstance(x,dict))
          except Exception:
              blob=r.text
          vins=sorted(set(re.findall(r'(?<![A-Z0-9])[A-HJ-NPR-Z0-9]{17}(?![A-Z0-9])', blob, re.I)))
          print('VINS', len(vins), vins[:10])
          if len(vins) < 10:
              raise SystemExit('Browser scraper did not return usable inventory')
          PY
